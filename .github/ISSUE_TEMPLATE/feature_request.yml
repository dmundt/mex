name: Feature request
description: Suggest an enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem does this solve? Note that mex is a Go port of Simon Willison's mcp-explorer — features beyond parity with the reference implementation are out of scope unless justified.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the change and how it affects output parity or exit behavior.
    validations:
      required: true